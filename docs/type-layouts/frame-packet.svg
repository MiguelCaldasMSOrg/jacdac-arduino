<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title description">
  <title id="title">Jacdac frame and packet wire storage</title>
  <desc id="description">A 12-byte frame header contains CRC, size, flags, and device identifier. Each aligned packet contains payload size, service index, service command, payload, and padding.</desc>
  <rect width="1120" height="370" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">Jacdac frame and packet storage</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">Frame fields are shared by one or more 4-byte-aligned service packets</text>
  <text x="48" y="102" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Frame: 12-byte header followed by frame_size bytes</text>
  <rect x="48" y="116" width="150" height="64" rx="4" fill="#d7664f" stroke="#9dafb2"/>
  <text x="123" y="143" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">CRC16</text>
  <text x="123" y="164" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">bytes 0..1</text>
  <rect x="206" y="116" width="100" height="64" rx="4" fill="#457b9d" stroke="#9dafb2"/>
  <text x="256" y="143" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">size</text>
  <text x="256" y="164" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">byte 2</text>
  <rect x="314" y="116" width="100" height="64" rx="4" fill="#7a5c99" stroke="#9dafb2"/>
  <text x="364" y="143" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">flags</text>
  <text x="364" y="164" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">byte 3</text>
  <rect x="422" y="116" width="330" height="64" rx="4" fill="#277f75" stroke="#9dafb2"/>
  <text x="587" y="143" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">device identifier</text>
  <text x="587" y="164" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">bytes 4..11 (u64 LE)</text>
  <rect x="760" y="116" width="312" height="64" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="916" y="143" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#172a3a" text-anchor="middle">frame data</text>
  <text x="916" y="164" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bytes 12..</text>
  <text x="48" y="222" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Each packet inside frame data</text>
  <rect x="48" y="236" width="166" height="64" rx="4" fill="#457b9d" stroke="#9dafb2"/>
  <text x="131" y="263" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">payload size</text>
  <text x="131" y="284" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">+0: u8</text>
  <rect x="222" y="236" width="166" height="64" rx="4" fill="#7a5c99" stroke="#9dafb2"/>
  <text x="305" y="263" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">service index</text>
  <text x="305" y="284" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">+1: low 6 bits</text>
  <rect x="396" y="236" width="238" height="64" rx="4" fill="#277f75" stroke="#9dafb2"/>
  <text x="515" y="263" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">service command</text>
  <text x="515" y="284" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">+2..3: u16 LE</text>
  <rect x="642" y="236" width="276" height="64" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="780" y="263" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#172a3a" text-anchor="middle">payload</text>
  <text x="780" y="284" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">+4..: 0..236 bytes</text>
  <rect x="926" y="236" width="146" height="64" rx="4" fill="#dce5e3" stroke="#9dafb2"/>
  <text x="999" y="263" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#172a3a" text-anchor="middle">padding</text>
  <text x="999" y="284" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">0..3 bytes</text>
  <text x="48" y="338" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">All multibyte fields are little-endian. Padding is not part of service_size; it aligns the next packet to 4 bytes.</text>
</svg>
