<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="242" viewBox="0 0 1120 242" role="img" aria-labelledby="title description">
  <title id="title">Accelerometer reading payload</title>
  <desc id="description">Three consecutive little-endian i12.20 values; 12 bytes total</desc>
  <rect width="1120" height="242" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">Accelerometer reading payload</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">Three consecutive little-endian i12.20 values; 12 bytes total</text>
  <rect x="48" y="104" width="336" height="76" rx="4" fill="#d7664f" stroke="#9dafb2"/>
  <text x="216" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">X: i12.20</text>
  <text x="216" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">bytes 0..3</text>
  <rect x="392" y="104" width="336" height="76" rx="4" fill="#277f75" stroke="#9dafb2"/>
  <text x="560" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Y: i12.20</text>
  <text x="560" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">bytes 4..7</text>
  <rect x="736" y="104" width="336" height="76" rx="4" fill="#7a5c99" stroke="#9dafb2"/>
  <text x="904" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Z: i12.20</text>
  <text x="904" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">bytes 8..11</text>
  <text x="48" y="214" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Decode each signed int32_t independently as raw / 1,048,576 g.</text>
</svg>
