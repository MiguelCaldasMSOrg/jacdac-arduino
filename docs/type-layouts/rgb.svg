<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="242" viewBox="0 0 1120 242" role="img" aria-labelledby="title description">
  <title id="title">Packed RGB color</title>
  <desc id="description">LED values use three adjacent u8 color operands in this order</desc>
  <rect width="1120" height="242" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">Packed RGB color</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">LED values use three adjacent u8 color operands in this order</text>
  <rect x="48" y="104" width="336" height="76" rx="4" fill="#d7664f" stroke="#9dafb2"/>
  <text x="216" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">red</text>
  <text x="216" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">byte 0</text>
  <rect x="392" y="104" width="336" height="76" rx="4" fill="#4c956c" stroke="#9dafb2"/>
  <text x="560" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">green</text>
  <text x="560" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">byte 1</text>
  <rect x="736" y="104" width="336" height="76" rx="4" fill="#457b9d" stroke="#9dafb2"/>
  <text x="904" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">blue</text>
  <text x="904" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">byte 2</text>
  <text x="48" y="214" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Each channel is 0..255. This is byte packing, not a native 24- or 32-bit integer.</text>
</svg>
