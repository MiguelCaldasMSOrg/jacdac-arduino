<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">u16.16</title>
  <desc id="description">u16.16. Unsigned binary fixed point in 32 bits. Little-endian 32-bit storage layout.</desc>
  <rect width="1120" height="360" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">u16.16</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">Unsigned binary fixed point in 32 bits</text>
  <text x="48" y="100" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Logical value bits (most significant to least significant)</text>
  <rect x="48" y="112" width="512" height="54" rx="4" fill="#277f75" stroke="#9dafb2"/>
  <text x="304" y="145" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">whole</text>
  <rect x="560" y="112" width="512" height="54" rx="4" fill="#e9b949" stroke="#9dafb2"/>
  <text x="816" y="145" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#172a3a" text-anchor="middle">fraction</text>
  <text x="48" y="190" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="13" font-weight="400" fill="#53656f" text-anchor="start">whole: unsigned integer bits   |   fraction: weights 2^-1 through 2^-16</text>
  <text x="48" y="220" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Wire bytes (in increasing address/transmission order)</text>
  <rect x="48" y="232" width="250" height="52" rx="4" fill="#457b9d" stroke="#9dafb2"/>
  <text x="173" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">byte 0</text>
  <text x="173" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">bits 7..0</text>
  <rect x="306" y="232" width="250" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="431" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 1</text>
  <text x="431" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 15..8</text>
  <rect x="564" y="232" width="250" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="689" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 2</text>
  <text x="689" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 23..16</text>
  <rect x="822" y="232" width="250" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="947" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 3</text>
  <text x="947" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 31..24</text>
  <text x="48" y="310" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#53656f" text-anchor="start">Little-endian: byte 0 carries the least-significant 8 bits.</text>
  <text x="48" y="336" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Decode: raw / 65,536   |   LSB: 2^-16   |   Range: 0 to 65,536 - 2^-16</text>
</svg>
