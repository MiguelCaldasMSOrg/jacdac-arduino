<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">uint8_t / u8</title>
  <desc id="description">uint8_t / u8. Unsigned 8-bit integer; 1 byte. Little-endian 8-bit storage layout.</desc>
  <rect width="1120" height="360" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">uint8_t / u8</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">Unsigned 8-bit integer; 1 byte</text>
  <text x="48" y="100" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Logical value bits (most significant to least significant)</text>
  <rect x="48" y="112" width="1024" height="54" rx="4" fill="#277f75" stroke="#9dafb2"/>
  <text x="560" y="145" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">value</text>
  <text x="48" y="190" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="13" font-weight="400" fill="#53656f" text-anchor="start">value: bits 7..0</text>
  <text x="48" y="220" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Wire bytes (in increasing address/transmission order)</text>
  <rect x="48" y="232" width="1024" height="52" rx="4" fill="#457b9d" stroke="#9dafb2"/>
  <text x="560" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">byte 0</text>
  <text x="560" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">bits 7..0</text>
  <text x="48" y="310" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#53656f" text-anchor="start">Little-endian: byte 0 carries the least-significant 8 bits.</text>
  <text x="48" y="336" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Range: 0 to 255</text>
</svg>
