<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="242" viewBox="0 0 1120 242" role="img" aria-labelledby="title description">
  <title id="title">Enum on the Jacdac wire</title>
  <desc id="description">The public service enums in this library have uint8_t backing storage</desc>
  <rect width="1120" height="242" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">Enum on the Jacdac wire</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">The public service enums in this library have uint8_t backing storage</text>
  <rect x="48" y="104" width="1024" height="76" rx="4" fill="#7a5c99" stroke="#9dafb2"/>
  <text x="560" y="135" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">enum code</text>
  <text x="560" y="160" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">byte 0</text>
  <text x="48" y="214" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">The byte is interpreted using the enum declared by that register's service specification.</text>
</svg>
