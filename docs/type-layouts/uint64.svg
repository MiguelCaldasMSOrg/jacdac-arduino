<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">uint64_t device identifier</title>
  <desc id="description">uint64_t device identifier. Unsigned 64-bit identifier; 8 bytes. Little-endian 64-bit storage layout.</desc>
  <rect width="1120" height="360" fill="#f7faf9"/>
  <text x="48" y="42" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="700" fill="#172a3a" text-anchor="start">uint64_t device identifier</text>
  <text x="48" y="70" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#53656f" text-anchor="start">Unsigned 64-bit identifier; 8 bytes</text>
  <text x="48" y="100" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Logical value bits (most significant to least significant)</text>
  <rect x="48" y="112" width="1024" height="54" rx="4" fill="#7a5c99" stroke="#9dafb2"/>
  <text x="560" y="145" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">identifier</text>
  <text x="48" y="190" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="13" font-weight="400" fill="#53656f" text-anchor="start">identifier: bits 63..0</text>
  <text x="48" y="220" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Wire bytes (in increasing address/transmission order)</text>
  <rect x="48" y="232" width="121" height="52" rx="4" fill="#457b9d" stroke="#9dafb2"/>
  <text x="108.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">byte 0</text>
  <text x="108.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">bits 7..0</text>
  <rect x="177" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="237.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 1</text>
  <text x="237.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 15..8</text>
  <rect x="306" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="366.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 2</text>
  <text x="366.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 23..16</text>
  <rect x="435" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="495.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 3</text>
  <text x="495.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 31..24</text>
  <rect x="564" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="624.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 4</text>
  <text x="624.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 39..32</text>
  <rect x="693" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="753.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 5</text>
  <text x="753.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 47..40</text>
  <rect x="822" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="882.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 6</text>
  <text x="882.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 55..48</text>
  <rect x="951" y="232" width="121" height="52" rx="4" fill="#ffffff" stroke="#9dafb2"/>
  <text x="1011.5" y="255" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#172a3a" text-anchor="middle">byte 7</text>
  <text x="1011.5" y="275" font-family="'Cascadia Code', 'IBM Plex Mono', monospace" font-size="11" font-weight="400" fill="#53656f" text-anchor="middle">bits 63..56</text>
  <text x="48" y="310" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#53656f" text-anchor="start">Little-endian: byte 0 carries the least-significant 8 bits.</text>
  <text x="48" y="336" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#172a3a" text-anchor="start">Used by Jacdac frames; it is an identifier, not a quantity</text>
</svg>
